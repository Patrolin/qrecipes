hot nutella:
  tools:
    - microwave
    - hand frother
  inputs:
    - 200 ml of 1.5% milk
    - 1 tsp nutella [not the "nutella" brand, keep in mind the storage requirements on the nutella]
    - 1 tbsp good tasting cocoa [Granko]
    - a pinch of salt [iodized sea salt]
  serving: 1 mug (≥240ml)
  steps:
    1: Pour the milk into a microwavable mug and heat in a microwave for 1 minute.
    2: Add the rest of the ingredients and mix with a hand frother.
