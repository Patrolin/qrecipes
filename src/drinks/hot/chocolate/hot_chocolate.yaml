hot chocolate:
  tools:
    - saucepan
    - whisk
  inputs:
    - 300 ml of 1.5% milk
    - 100 g chocolate
    - a pinch of salt [iodized sea salt]
  serving: 2 mugs (≥240ml)
  steps:
    1: Add all ingredients into a saucepan and heat on medium-low.
    2: Break up the chocolate into smaller pieces with a whisk until it melts.
    3: Heat to 100°C and boil on medium heat for 1 minute.
    4: Pour into mugs.
