hot chocolate:
  tools:
    - saucepan
    - whisk
  ingredients:
    - 350 ml of 1.5% milk
    - 100 g (dark) chocolate
    - 20 g vanilla sugar
    - a pinch of salt [iodized sea salt]
  serving: 2 mugs (≥240ml)
  steps:
    1: Break up the chocolate into smaller pieces.
    2: Add all ingredients into a saucepan.
    3: Heat on high heat and whisk until the chocolate melts.
    4: Pour into mugs.
