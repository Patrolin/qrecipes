hot chocolate:
  tools:
    - saucepan
    - whisk
  inputs:
    - 300 ml of 1.5% milk
    - 100 g chocolate
    - 2 tbsp of good tasting cocoa [Granko]
    - a pinch of salt [iodized sea salt]
  serving: 2 mugs (≥240ml)
  steps:
    1: Add all ingredients into a saucepan and warm it up to below boiling (60 - 75°C).
    2: Break up the chocolate into smaller pieces with a whisk until it melts.
