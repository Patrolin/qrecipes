hot chocolate:
  tools:
    - saucepan
    - whisk
  ingredients:
    - 300 ml of 1.5% milk
    - 100 g (dark) chocolate
    - 20 g vanilla sugar
    - a pinch of salt [iodized sea salt]
  serving: 2 mugs (≥240ml)
  steps:
    1: Add all ingredients into a saucepan.
    2: Heat to 100°C (until chocolate rises to the top) and boil on high heat for 1 minute.
    3: Reduce heat to medium-low and break up the chocolate into smaller pieces with a whisk until everything melts.
    4: Pour into mugs.
