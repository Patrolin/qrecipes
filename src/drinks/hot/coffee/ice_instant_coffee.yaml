ice instant coffee:
  tools:
    hand frother:
  inputs:
    - 1 tsp instant coffee
    - 1/2 tsp (brown) sugar
    - 20 ml water
    - some ice
    - 200 ml of 1.5% milk
  serving: coffee cup (≥240ml)
  steps:
    1: Add instant coffee, sugar and water to a cup and froth the mixture into a slight foam.
    2: Add ice and milk.
