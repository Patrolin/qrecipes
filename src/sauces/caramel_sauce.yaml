caramel syrup:
  tools:
    - saucepan
    - kettle
  ingredients:
    - 1 cup (200 g) sugar/honey
    - 1 cup (200 ml) water
  serving: 400 ml caramel syrup
  steps:
    1: Add sugar to a saucepan and heat on low-medium heat.
    2: Separately, heat water to 100°C.
    3: Mix the sugar until it melts.
    4: While the sugar is still hot, add the boiling water.
    5: Let it cool for 20 minutes.
