caramel syrup:
  tools:
    - saucepan
    - kettle
  ingredients:
    - 1 cup (200 g) sugar/honey
    - 1 cup (200 ml) water
  serving: 400 ml caramel syrup
  steps:
    1: Add sugar to a saucepan and heat on high heat.
    2: Separately, heat water to 100°C.
    3: When bubbles form, lower the heat to low and mix until it melts.
    4: Add the boiling water and let it cool for 20 minutes.
