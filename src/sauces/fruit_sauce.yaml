fruit sauce:
  tools:
    - saucepan
  ingredients:
    - 2 cups (480 g) fruit [strawberries + blackberries]
    - 80 g sugar
  serving: 400(?) ml jar
  steps:
    1: Add all ingredients to a saucepan and heat on medium heat.
    2: Mix until the sugar melts and the fruit starts breaking down.
    3: Pour into a jar and let it cool in a fridge.
