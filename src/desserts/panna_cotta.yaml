panna cotta:
  tools:
    - teaspoon
    - saucepan
  inputs:
    - 4g gelatin powder
    - 30-60 ml water or milk
    - 2 cups (480 ml) heavy cream
    - 40-50g vanilla sugar
  serving: 4-5 dessert cups (≥120ml)
  steps:
    1: Prepare gelatin mix
    1.1: Add water and gelatin powder to a mixing bowl.
    1.2: Mix to separate clumps and let it sit for at least 10 minutes.
    2: Cook the cream
    2.1: Add vanilla sugar and heavy cream to a saucepan.
    2.2: Heat to 100°C and boil on medium heat for 1 minute, then lower heat to low.
    3: Add gelatin mix and swirl.
    4: Pour into separate dessert cups, and refridgerate for at least 2 hours.
    5: Serve with fruit or some type of sauce.
