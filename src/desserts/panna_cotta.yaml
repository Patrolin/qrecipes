panna cotta:
  tools:
    - saucepan
    - whisk
  inputs:
    - 4g gelatin powder
    - 60 ml water or milk
    - 2 cups (480 ml) heavy cream
    - 40g vanilla sugar
    - 10g sugar
  serving: 4-5 dessert cups (≥120ml)
  steps:
    1: Prepare gelatin mix
    1.1: Add water and gelatin powder to a mixing bowl.
    1.2: Mix to separate clumps of gelatin powder and let it sit for at least 10 minutes.
    2: Add vanilla sugar, sugar and heavy cream to a saucepan and heat to 80-100°C.
    3: Add gelatin mix to sauce pan and cook for 1 minute.
    4: Pour into separate dessert cups and refridgerate for at least 2 hours.
    5: Serve with fruit or some type of sauce.
